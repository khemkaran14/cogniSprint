name: Container build and security scan

on:
  push:
    branches: [master, work]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-dockerfiles:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: [client/Dockerfile, server/Dockerfile]
    steps:
      - uses: actions/checkout@v4
      - name: Lint ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  build-and-scan:
    name: Build and scan ${{ matrix.application }}
    runs-on: ubuntu-latest
    needs: lint-dockerfiles
    strategy:
      fail-fast: false
      matrix:
        application: [client, server]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.application }}
          file: ${{ matrix.application }}/Dockerfile
          load: true
          push: false
          tags: cognisprint-${{ matrix.application }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.application }}
          cache-to: type=gha,mode=max,scope=${{ matrix.application }}
      - name: Scan OS and application dependencies
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: cognisprint-${{ matrix.application }}:${{ github.sha }}
          format: table
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
