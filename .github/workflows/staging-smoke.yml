name: Staging deployment smoke tests

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: API origin (defaults to the STAGING_API_URL repository variable)
        required: false
        type: string
      app_url:
        description: Web origin (defaults to the STAGING_APP_URL repository variable)
        required: false
        type: string
  deployment_status:

permissions:
  contents: read
  deployments: read

concurrency:
  group: staging-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Verify deployed API and web application
        run: npm run smoke:deployment
        env:
          API_URL: ${{ inputs.api_url || vars.STAGING_API_URL }}
          APP_URL: ${{ inputs.app_url || github.event.deployment_status.environment_url || vars.STAGING_APP_URL }}
